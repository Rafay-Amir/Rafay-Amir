<svg width="240" height="50" viewBox="0 0 240 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&amp;display=swap');
      .otw { font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 1.6px; }
    </style>

    <linearGradient id="otwBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#86EFAC"/>
      <animate attributeName="x1" values="-30%;130%;-30%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="70%;230%;70%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="otwText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="45%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
      <animate attributeName="x1" values="-20%;120%;-20%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%;80%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="otwGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="otwClip">
      <rect x="1.5" y="1.5" width="237" height="47" rx="23.5"/>
    </clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="237" height="47" rx="23.5" fill="#0A120C" stroke="url(#otwBorder)" stroke-width="1.4"/>

  <!-- reflection / shine sweep -->
  <g clip-path="url(#otwClip)">
    <rect x="-60" y="0" width="40" height="50" fill="#FFFFFF" opacity="0.10" transform="skewX(-20)">
      <animate attributeName="x" values="-60;280" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- blinking active dot -->
  <circle cx="26" cy="25" r="5.5" fill="#22C55E" filter="url(#otwGlow)">
    <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="26" cy="25" r="5.5" fill="none" stroke="#22C55E" stroke-width="1.3">
    <animate attributeName="r" values="5.5;15;5.5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="45" y="30" class="otw" font-size="16" fill="url(#otwText)" filter="url(#otwGlow)">
    OPEN TO WORK
  </text>
</svg>
