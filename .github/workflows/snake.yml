name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"     # runs once a day
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs (ember theme)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Rafay-Amir
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23F8FAFC&color_dots=%231A1010,%237F1D1D,%23DC2626,%23F97316,%23FBBF24
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F8FAFC&color_dots=%231A1010,%237F1D1D,%23DC2626,%23F97316,%23FBBF24

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
