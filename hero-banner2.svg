<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Rajdhani:wght@500;600&amp;display=swap');
      .title { font-family: 'Orbitron', sans-serif; font-weight: 900; }
      .sub   { font-family: 'Rajdhani', sans-serif; font-weight: 600; letter-spacing: 8px; }
      .tag   { font-family: 'Rajdhani', sans-serif; font-weight: 500; letter-spacing: 1px; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0A0A"/>
      <stop offset="45%" stop-color="#2B0E0E"/>
      <stop offset="100%" stop-color="#0F0A0A"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="45%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#FBBF24"/>
      <animate attributeName="x1" values="-20%;120%;-20%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%;80%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#FF9C7A"/>
      <stop offset="70%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
      <animate attributeName="x1" values="-20%;120%;-20%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%;80%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#DC2626" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- ambient glow behind the atom -->
  <circle cx="190" cy="160" r="150" fill="url(#glowGrad)">
    <animate attributeName="r" values="140;165;140" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting "atom" signature, nodding to React -->
  <g transform="translate(190,160)" filter="url(#softGlow)">
    <ellipse rx="95" ry="34" fill="none" stroke="#F97316" stroke-width="1.6" stroke-opacity="0.85" transform="rotate(0)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="95" ry="34" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-opacity="0.85" transform="rotate(60)">
      <animateTransform attributeName="transform" type="rotate" from="60 0 0" to="420 0 0" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="95" ry="34" fill="none" stroke="#FBBF24" stroke-width="1.6" stroke-opacity="0.85" transform="rotate(120)">
      <animateTransform attributeName="transform" type="rotate" from="120 0 0" to="480 0 0" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <circle r="9" fill="#F8FAFC">
      <animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <circle r="4" fill="#F97316">
      <animateMotion dur="7s" repeatCount="indefinite" path="M 95 0 A 95 34 0 1 1 -95 0 A 95 34 0 1 1 95 0"/>
    </circle>
    <circle r="4" fill="#FBBF24">
      <animateMotion dur="9s" repeatCount="indefinite" path="M 47.5 82.3 A 95 34 60 1 1 -47.5 -82.3 A 95 34 60 1 1 47.5 82.3"/>
    </circle>
  </g>

  <!-- floating code particles -->
  <g font-family="Rajdhani, sans-serif" font-size="16" fill="#F97316" opacity="0.65">
    <text x="60" y="290"><animate attributeName="y" values="300;20;300" dur="9s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="0s" repeatCount="indefinite"/>&lt;/&gt;</text>
    <text x="330" y="60" fill="#FBBF24"><animate attributeName="y" values="300;10;300" dur="11s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="11s" begin="2s" repeatCount="indefinite"/>{ }</text>
    <text x="120" y="40" fill="#DC2626"><animate attributeName="y" values="300;30;300" dur="8s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="4s" repeatCount="indefinite"/>=&gt;</text>
    <text x="280" y="250"><animate attributeName="y" values="320;40;320" dur="10s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.55;0" dur="10s" begin="1.2s" repeatCount="indefinite"/>&lt;div/&gt;</text>
  </g>

  <!-- name + role -->
  <g transform="translate(370,0)">
    <text x="0" y="150" class="title" font-size="66" fill="url(#titleGrad)" filter="url(#softGlow)">
      RAFAY AMIR
      <animateTransform attributeName="transform" type="scale" values="1;1.015;1" dur="3.5s" repeatCount="indefinite" additive="sum"/>
    </text>

    <text x="4" y="190" class="sub" font-size="19" fill="#F97316">
      FRONTEND DEVELOPER
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
    </text>

    <text x="4" y="222" class="tag" font-size="17" fill="#94A3B8">
      React.js • Next.js • Crafting modern, high-performance UI
    </text>

    <!-- animated loading / build bar -->
    <rect x="4" y="244" width="700" height="3" rx="1.5" fill="#1F1212"/>
    <rect x="4" y="244" height="3" rx="1.5" fill="url(#textGrad)">
      <animate attributeName="width" values="0;700;0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
